apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: gcp-secret-store
  namespace: opentinker
spec:
  provider:
    gcpsm:
      projectID: development-472321
      auth:
        workloadIdentity:
          clusterLocation: us-central1
          clusterName: dev-autopilot-cluster
          serviceAccountRef:
            name: external-secrets-sa
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: opentinker
  annotations:
    # Workload Identity annotation (will be patched in overlays)
    # iam.gke.io/gcp-service-account: external-secrets@PROJECT_ID.iam.gserviceaccount.com
