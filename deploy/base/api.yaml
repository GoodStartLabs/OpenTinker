apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: opentinker
  labels:
    app: opentinker-api
    component: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: opentinker-api
  template:
    metadata:
      labels:
        app: opentinker-api
        component: gateway
    spec:
      containers:
      - name: api
        image: us-central1-docker.pkg.dev/development-472321/opentinker/api:latest
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: CELERY_BROKER_URL
          value: "amqp://admin:admin@rabbitmq:5672//"
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: API_KEY
        - name: LOG_LEVEL
          value: "INFO"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsUser: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: opentinker
  labels:
    app: opentinker-api
spec:
  selector:
    app: opentinker-api
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  type: ClusterIP
