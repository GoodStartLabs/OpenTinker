apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: opentinker

resources:
  - namespace.yaml
  - api.yaml
  - worker.yaml
  - worker-serviceaccount.yaml
  - worker-keda-autoscaler.yaml
  - rabbitmq.yaml
  - secret-store.yaml

images:
  - name: us-central1-docker.pkg.dev/development-472321/opentinker/gsl-opentinker-api
    newTag: latest
  - name: us-central1-docker.pkg.dev/development-472321/opentinker/gsl-opentinker-worker
    newTag: latest

commonLabels:
  app.kubernetes.io/part-of: opentinker
  app.kubernetes.io/managed-by: kustomize
