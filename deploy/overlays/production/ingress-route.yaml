apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opentinker-api
  namespace: opentinker-prod
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - opentinker-api.yourdomain.com
    secretName: opentinker-api-tls
  rules:
  - host: opentinker-api.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api
            port:
              number: 80
