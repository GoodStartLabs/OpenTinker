apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-secrets
  namespace: opentinker-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: SecretStore
  target:
    name: app-secrets
    creationPolicy: Owner
  data:
  - secretKey: API_KEY
    remoteRef:
      key: opentinker-api-key-prod
  - secretKey: RABBITMQ_PASSWORD
    remoteRef:
      key: opentinker-rabbitmq-password-prod
  - secretKey: GCP_SERVICE_ACCOUNT_KEY
    remoteRef:
      key: opentinker-gcp-sa-key-prod
---
apiVersion: v1
kind: Secret
metadata:
  name: keda-rabbitmq-secret
  namespace: opentinker-prod
type: Opaque
stringData:
  host: amqp://admin:admin@rabbitmq.opentinker-prod.svc.cluster.local:5672//
