# KEDA needs this secret in the workers namespace to query RabbitMQ queue length.
# Use HTTP Management API (port 15672) so we can set excludeUnacknowledged: true and scale
# only on ready messages, not unacked (messages already being processed by workers).
apiVersion: v1
kind: Secret
metadata:
  name: keda-rabbitmq-secret
  namespace: opentinker-workers-us-central1
type: Opaque
stringData:
  host: http://admin:admin@rabbitmq.opentinker-dev.svc.cluster.local:15672/
