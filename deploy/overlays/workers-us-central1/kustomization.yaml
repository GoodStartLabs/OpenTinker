apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: opentinker-workers-us-central1

resources:
  - ../../workers-base
  - secret-store.yaml
  - namespace.yaml
  - keda-rabbitmq-secret.yaml
  - external-secret-wandb.yaml

images:
  - name: us-central1-docker.pkg.dev/development-472321/opentinker/worker
    newTag: latest

patches:
  # Region-specific configuration for us-central1
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: worker
      spec:
        template:
          spec:
            nodeSelector:
              cloud.google.com/gke-accelerator: nvidia-h100-80gb
              topology.kubernetes.io/region: us-central1
            containers:
            - name: worker
              env:
              - name: WORKER_REGION
                value: "us-central1"
              - name: CELERY_BROKER_URL
                value: "amqp://admin:admin@rabbitmq.opentinker-dev.svc.cluster.local:5672//"
    target:
      kind: Deployment
      name: worker

  # Cap replicas and scale only on ready messages (not unacked) in us-central1
  - patch: |-
      apiVersion: keda.sh/v1alpha1
      kind: ScaledObject
      metadata:
        name: opentinker-worker-scaler
      spec:
        minReplicaCount: 0
        maxReplicaCount: 0
        idleReplicaCount: 0
        triggers:
        - type: rabbitmq
          metadata:
            queueName: opentinker-training
            mode: QueueLength
            value: "1"
            protocol: http
            excludeUnacknowledged: "true"
          authenticationRef:
            name: keda-rabbitmq-auth
    target:
      kind: ScaledObject
      name: opentinker-worker-scaler

  # GCP Secret Store (namespace for workload identity)
  - path: secret-store-patch.yaml
    target:
      kind: SecretStore
      name: gcp-secret-store

  # Update service account with Workload Identity
  - patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: worker
        annotations:
          iam.gke.io/gcp-service-account: opentinker-worker-us-central1@development-472321.iam.gserviceaccount.com
    target:
      kind: ServiceAccount
      name: worker

commonLabels:
  region: us-central1
  gpu-type: h100
  app.kubernetes.io/instance: opentinker-workers-us-central1
