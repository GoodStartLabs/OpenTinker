# Pulls OPENTINKER_WANDB_API_KEY_DEV from GCP Secret Manager into K8s secret wandb-api-key (env: WANDB_API_KEY).
# Ensure secret exists in GCP: gcloud secrets create OPENTINKER_WANDB_API_KEY_DEV --project=development-472321 ...
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: wandb-api-key
  labels:
    app.kubernetes.io/name: opentinker-worker
    app.kubernetes.io/part-of: opentinker-workers
    region: us-central1
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: SecretStore
  target:
    name: wandb-api-key
    creationPolicy: Owner
  data:
  - secretKey: WANDB_API_KEY
    remoteRef:
      key: OPENTINKER_WANDB_API_KEY_DEV
