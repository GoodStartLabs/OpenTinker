apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: opentinker-workers-us-east4

resources:
  - ../../base/worker.yaml
  - ../../base/worker-serviceaccount.yaml
  - ../../base/worker-keda-autoscaler.yaml
  - namespace.yaml

images:
  - name: us-central1-docker.pkg.dev/development-472321/opentinker/gsl-opentinker-worker
    newTag: test

patches:
  # Region-specific configuration for us-east4
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: worker
      spec:
        template:
          spec:
            nodeSelector:
              cloud.google.com/gke-accelerator: nvidia-h100-80gb
              topology.kubernetes.io/region: us-east4
            containers:
            - name: worker
              env:
              - name: WORKER_REGION
                value: "us-east4-a"
              - name: CELERY_BROKER_URL
                value: "amqp://admin:admin@RABBITMQ_EXTERNAL_IP:5672//"
    target:
      kind: Deployment
      name: worker

  # Update service account with Workload Identity
  - patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: worker
        annotations:
          iam.gke.io/gcp-service-account: opentinker-worker-us-east4@development-472321.iam.gserviceaccount.com
    target:
      kind: ServiceAccount
      name: worker

commonLabels:
  region: us-east4
  gpu-type: h100
  app.kubernetes.io/instance: opentinker-workers-us-east4
