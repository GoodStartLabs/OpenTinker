apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: opentinker-workers-us-east4

resources:
  - ../../workers-base
  - namespace.yaml
  - keda-rabbitmq-secret.yaml

images:
  - name: us-central1-docker.pkg.dev/development-472321/opentinker/worker
    newTag: latest

patches:
  # Region us-east4 required; prefer zone us-east4-a (GPUs available), fall back to us-east4-b/c if needed
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: worker
      spec:
        template:
          spec:
            nodeSelector:
              cloud.google.com/gke-accelerator: nvidia-h100-80gb
              topology.kubernetes.io/region: us-east4
            affinity:
              nodeAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                    - key: topology.kubernetes.io/zone
                      operator: In
                      values: [us-east4-a]
            containers:
            - name: worker
              env:
              - name: WORKER_REGION
                value: "us-east4-a"
              # Internal LoadBalancer IP of rabbitmq-external service in us-central1 cluster
              - name: CELERY_BROKER_URL
                value: "amqp://admin:admin@10.128.0.37:5672//"
    target:
      kind: Deployment
      name: worker

  # Update service account with Workload Identity
  - patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: worker
        annotations:
          iam.gke.io/gcp-service-account: opentinker-worker-us-east4@development-472321.iam.gserviceaccount.com
    target:
      kind: ServiceAccount
      name: worker

commonLabels:
  region: us-east4
  gpu-type: h100
  app.kubernetes.io/instance: opentinker-workers-us-east4
