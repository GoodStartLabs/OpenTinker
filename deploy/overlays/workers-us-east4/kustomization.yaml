apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: opentinker-workers-us-east4

resources:
  - ../../workers-base
  - namespace.yaml
  - keda-rabbitmq-secret.yaml
  - external-secret-wandb.yaml

images:
  - name: us-central1-docker.pkg.dev/development-472321/opentinker/worker
    newTag: latest

patches:
  # H100 GPU configuration - Autopilot automatically uses Accelerator compute class
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: worker
      spec:
        template:
          spec:
            nodeSelector:
              # H100 80GB GPU type with 8 GPUs
              cloud.google.com/gke-accelerator: nvidia-h100-80gb
              cloud.google.com/gke-accelerator-count: "8"
            containers:
            - name: worker
              env:
              - name: WORKER_REGION
                value: "us-east4"
              # Internal LoadBalancer IP of rabbitmq-external service in us-central1 cluster
              - name: CELERY_BROKER_URL
                value: "amqp://admin:admin@10.128.0.37:5672//"
              # Request 8 H100 GPUs (a3-highgpu-8g machine type)
              resources:
                requests:
                  memory: "64Gi"
                  cpu: "16"
                  nvidia.com/gpu: "8"
                limits:
                  memory: "128Gi"
                  cpu: "32"
                  nvidia.com/gpu: "8"
    target:
      kind: Deployment
      name: worker

  # GCP Secret Store (cluster + namespace for us-east4)
  - path: secret-store-patch.yaml
    target:
      kind: SecretStore
      name: gcp-secret-store

  # Update service account with Workload Identity
  - patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: worker
        annotations:
          iam.gke.io/gcp-service-account: opentinker-worker-us-east4@development-472321.iam.gserviceaccount.com
    target:
      kind: ServiceAccount
      name: worker

commonLabels:
  region: us-east4
  gpu-type: h100
  app.kubernetes.io/instance: opentinker-workers-us-east4
