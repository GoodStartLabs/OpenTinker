apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: h100-8gpu
spec:
  # Priority: try us-east4-a first (confirmed H100 availability), then fall back to other zones
  priorities:
    # A3 machine with 8 H100 GPUs (matches working manual VM configuration)
    - machineType: a3-highgpu-8g
      gpu:
        count: 8
        type: nvidia-h100-80gb
      zones:
        - us-east4-a
        - us-east4-b
        - us-east4-c
  nodePoolAutoCreation:
    enabled: true
