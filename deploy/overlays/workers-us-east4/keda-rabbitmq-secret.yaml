# KEDA needs this secret in the workers namespace to query RabbitMQ queue length.
# RabbitMQ runs in opentinker-dev on the us-central1 cluster; us-east4 uses the internal LB IP.
apiVersion: v1
kind: Secret
metadata:
  name: keda-rabbitmq-secret
  namespace: opentinker-workers-us-east4
type: Opaque
stringData:
  # Internal LoadBalancer IP of rabbitmq-external service in us-central1 cluster
  host: amqp://admin:admin@10.128.0.37:5672//
