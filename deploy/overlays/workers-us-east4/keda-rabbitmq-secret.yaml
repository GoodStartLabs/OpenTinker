# KEDA needs this secret in the workers namespace to query RabbitMQ queue length.
# RabbitMQ runs in opentinker-dev; use in-cluster DNS when workers are in the same cluster.
# For a separate us-east4 cluster, replace with: amqp://admin:admin@<rabbitmq-external-ip>:5672//
apiVersion: v1
kind: Secret
metadata:
  name: keda-rabbitmq-secret
  namespace: opentinker-workers-us-east4
type: Opaque
stringData:
  host: amqp://admin:admin@rabbitmq.opentinker-dev.svc.cluster.local:5672//
