apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: opentinker-worker-scaler
  namespace: opentinker
  labels:
    app: opentinker-worker
spec:
  scaleTargetRef:
    name: worker
  minReplicaCount: 1   # At least 1 worker (idleReplicaCount only supports 0 in KEDA; use minReplicaCount for standby)
  maxReplicaCount: 20
  cooldownPeriod: 300  # 5 minutes
  triggers:
  - type: rabbitmq
    metadata:
      queueName: opentinker-training
      mode: QueueLength
      value: "1"  # Scale up when > 1 messages per worker
      protocol: amqp
    authenticationRef:
      name: keda-rabbitmq-auth
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: keda-rabbitmq-auth
  namespace: opentinker
spec:
  secretTargetRef:
  - parameter: host
    name: keda-rabbitmq-secret
    key: host
